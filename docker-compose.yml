services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SAFE_MODE=true
      - ALLOWED_TARGET_HOSTS=localhost,127.0.0.1,::1,mock-target,backend,sentinel-backend,frontend
      - DATABASE_URL=sqlite+aiosqlite:////app/data/sentinel.db
      - SYNC_DATABASE_URL=sqlite:////app/data/sentinel.db
      - SENTINEL_API_KEY=
      - MAX_CONCURRENT_TESTS=5
      - DEFAULT_TEST_TIMEOUT_SECONDS=15.0
    volumes:
      - sentinel-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  sentinel-data:
