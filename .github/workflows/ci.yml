name: LLM RedTeam CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint, Typecheck, and Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js 20 (for Promptfoo CLI integration tests)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Promptfoo CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
          npm install -g promptfoo@0.125.1 --no-audit --no-fund

      - name: Run Ruff Lint Checks
        run: |
          ruff check backend

      - name: Run Pytest Security & Regression Suites (Zero-Token / Local Mode)
        env:
          SAFE_MODE: "true"
          ENVIRONMENT: "test"
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
        run: |
          set -o pipefail
          pytest backend/tests -v --tb=short --cov=backend/app --cov-report=term-missing 2>&1 | tee pytest_ci.log || {
            grep -E '^(FAILED|ERROR)|^E  ' pytest_ci.log | head -15 | sed 's/%//g' | while read -r l; do echo "::error::$l"; done
            exit 1
          }

  promptfoo-eval:
    name: Promptfoo Security Evaluation & Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend & Pinned Promptfoo CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
          npm install -g promptfoo@0.125.1 --no-audit --no-fund

      - name: Start Mock Target & Backend API Service
        env:
          SAFE_MODE: "true"
          ENVIRONMENT: "ci"
        run: |
          nohup uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > backend_ci.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "Mock Target & Backend API online."
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/evaluations/promptfoo/status

      - name: Validate Promptfoo YAML Configurations
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from app.integrations.promptfoo import PromptfooConfigGenerator, validate_promptfoo_config_dict; cfg = PromptfooConfigGenerator().generate_config(target='mock-secure'); validate_promptfoo_config_dict(cfg); print('Validated tests:', len(cfg['tests']))"

      - name: Execute Deterministic Promptfoo Evaluation & Validate Metrics
        env:
          SAFE_MODE: "true"
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
        run: |
          python scripts/run_promptfoo_eval.py --target both --output-dir artifacts/promptfoo/reports

      - name: Verify Report Sanitization (Zero Secret/Canary Leakage)
        run: |
          python -c "import pathlib; text = pathlib.Path('artifacts/promptfoo/reports/promptfoo_vulnerable_report.json').read_text(encoding='utf-8'); assert 'LLM_REDTEAM_SECRET_7F92A1' not in text; assert 'CANARY_SEC_SENTINEL_ALPHA99' not in text; print('Sanitization check passed.')"

      - name: Upload Sanitized Promptfoo Evaluation Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promptfoo-sanitized-security-reports
          path: artifacts/promptfoo/reports/
          retention-days: 14

  frontend-ci:
    name: Frontend Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate TypeScript Compilation & Production Bundle
        working-directory: frontend
        run: npm run build

  docker-ci:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, promptfoo-eval, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: llm-sentinel-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: llm-sentinel-frontend:latest
